# pbp.dustincremascoli.com -- Play-by-Play Warehouse Explorer.
#
# Install to /etc/nginx/conf.d/pbp.conf. This is the post-certbot state; see
# pbp-http.conf for the bootstrap half and README-deploy.md for the order.
#
# ------------------------------------------------------------------------------
# THE APP BEHIND THIS DOES NOT EXIST YET
# ------------------------------------------------------------------------------
# This vhost was installed ahead of the application on purpose, so DNS, TLS and
# the rate limits are settled and proven before there is anything to break. Until
# something listens on 127.0.0.1:8504 every request here renders the maintenance
# page. That is the intended state, not a fault.
#
# What must be true when the app arrives:
#   * it binds 127.0.0.1:8504 ONLY -- Streamlit otherwise binds 0.0.0.0, which
#     publishes the port on the public EIP, past nginx and past everything below.
#     provision.sh asserts this for the MCP server; add the same assertion for
#     the app.
#   * it runs as its own user (`pbpapp`), holding the LLM API key and NO database
#     credential. pbp_ro's password belongs to pbpmcp alone.
#   * it carries its own spend caps. See below for why nginx cannot provide them.
#
# ------------------------------------------------------------------------------
# WHAT NGINX CAN AND CANNOT PROTECT HERE -- READ THIS BEFORE TUNING THE LIMITS
# ------------------------------------------------------------------------------
# This will be a PUBLIC, UNAUTHENTICATED endpoint that spends money per
# interaction. It is tempting to reason "limit_req caps the cost". IT DOES NOT,
# and believing it would leave the real hole open.
#
# Streamlit sends every user action over ONE long-lived WebSocket. A visitor
# loads the page (a burst of HTTP requests, which limit_req does see), and then
# asks twenty questions over that single already-established connection --
# generating ZERO further HTTP requests for limit_req to count. So:
#
#   limit_req  protects against page-load hammering and scraping.  Useful.
#   limit_conn protects against one IP opening many parallel sessions to
#              multiply its question allowance.  This is the useful lever.
#   The actual spend cap must be IN THE APP: a per-session question limit and a
#              global daily token budget that fails closed.
#
# If the LLM bill ever looks wrong, the app is where to fix it. Tuning the
# numbers in this file will not help.
#
# ------------------------------------------------------------------------------
# THE MCP SERVER IS NOT PROXIED HERE, AND MUST NOT BE
# ------------------------------------------------------------------------------
# 127.0.0.1:8771 serves the MCP endpoint with NO AUTHENTICATION OF ANY KIND. It
# is reachable only from the box's loopback, which is the entire security model
# for it. Adding a `location /mcp { proxy_pass ... }` here would publish a
# read-any-table-you-like SQL interface to the internet. The app reaches it over
# the loopback; nothing else needs to.

# 20r/s, matching analytics.conf and sqlx.conf, for the reason documented there:
# Streamlit is a JavaScript SPA that requests 60-100 chunked .js/.css files in
# one burst on first load. The 120r/m used by the Flask vhosts returned 429 for
# most of that burst, so core chunks never arrived and the page rendered blank
# with no visible error. Symptom to look for in pbp.error.log:
#   "limiting requests, excess: ... by zone pbp_all"
limit_req_zone $binary_remote_addr zone=pbp_all:10m rate=20r/s;

# Concurrent WebSocket sessions per IP. THIS is the limit that bounds LLM spend
# from one source, because a per-session question cap is only meaningful if one
# visitor cannot hold many sessions at once. 4 is generous for a real person with
# a few tabs and still turns "N questions per session" into a bounded number.
limit_conn_zone $binary_remote_addr zone=pbp_conn:10m;

upstream pbp_app {
    server 127.0.0.1:8504 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pbp.dustincremascoli.com;

    # NOT OPTIONAL even though this block only redirects. A server block with no
    # access_log inherits the http-level weblog_json log from 00-weblog.conf.
    # Here capture IS wanted, so both lines are present deliberately -- the plain
    # log for debugging, the JSON one for the pipeline. (Contrast analytics.conf,
    # where a single plain access_log is what SUPPRESSES capture.)
    access_log /var/log/nginx/pbp.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pbp.dustincremascoli.com;

    ssl_certificate     /etc/letsencrypt/live/pbp.dustincremascoli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbp.dustincremascoli.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"                always;
    # Indexing is wanted here -- it is a showcase. No X-Robots-Tag noindex,
    # unlike analytics.conf.

    client_max_body_size 1m;   # nothing is uploaded; questions are a few hundred bytes

    access_log /var/log/nginx/pbp.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;
    error_log  /var/log/nginx/pbp.error.log;

    # Streamlit's health endpoint. Returns the literal string "ok" and nothing
    # else; used by provision.sh and by any uptime check.
    location = /_stcore/health {
        proxy_pass http://pbp_app;
        access_log off;
    }

    # The WebSocket carrying every UI update.
    #
    # limit_conn, NOT limit_req. A reconnect storm after a service restart would
    # trip a request limiter and lock every page out of recovering -- the failure
    # mode analytics.conf documents. A CONNECTION limit does the useful thing
    # instead: it caps how many simultaneous sessions one IP can hold, which is
    # what bounds question volume from a single source.
    location /_stcore/stream {
        limit_conn pbp_conn 4;
        limit_conn_status 429;
        include /etc/nginx/proxy_params_pbp.inc;
    }

    # Streamlit's immutable build assets. Not rate limited: this is the 60-100
    # request burst that breaks the page, and it is the same chunks every load.
    # A burst of static chunk requests is cheap to serve and costs nothing in LLM
    # tokens, which is the thing actually worth protecting.
    location /static/ {
        include /etc/nginx/proxy_params_pbp.inc;
        access_log off;
    }

    location / {
        limit_req zone=pbp_all burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_pbp.inc;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
