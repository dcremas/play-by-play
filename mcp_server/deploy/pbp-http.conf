# pbp.dustincremascoli.com -- BOOTSTRAP vhost, HTTP only.
#
# Install to /etc/nginx/conf.d/pbp.conf FIRST, so certbot has a webroot to answer
# the ACME challenge from, then run enable-tls.sh which replaces this file with
# pbp.conf. Installing the TLS vhost first fails `nginx -t`: it references
# certificate files that do not exist yet.
#
# THE FILENAME MATTERS ON THIS BOX. nginx.conf does `include conf.d/*.conf;`
# before its own `server_name _` block, so the alphabetically-first .conf with a
# `listen` directive owns default_server for :80 and :443 -- today that is
# analytics.conf. "pbp.conf" sorts after it, which is required: rename this to
# anything sorting earlier and every unknown-Host request on the box starts
# being answered by this vhost, with this certificate.

upstream pbp_app {
    # The explorer app is NOT BUILT YET. 8504 is reserved for it (8502 and 8503
    # are the weblog dashboard and the weather explorer). Until it exists this
    # upstream refuses connections and the vhost serves the maintenance page,
    # which is the honest state: the site resolves, TLS is valid, nothing is
    # behind it.
    server 127.0.0.1:8504 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pbp.dustincremascoli.com;

    # See the note in pbp.conf: capture is wanted on this vhost, unlike the
    # analytics dashboard.
    access_log /var/log/nginx/pbp.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;
    error_log  /var/log/nginx/pbp.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /_stcore/health {
        proxy_pass http://pbp_app;
        access_log off;
    }

    location /_stcore/stream {
        include /etc/nginx/proxy_params_pbp.inc;
    }

    location / {
        include /etc/nginx/proxy_params_pbp.inc;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
