# The Dash instance explorer's http-level declarations.
#
# Install to /etc/nginx/conf.d/pbp-web.conf.
#
# This file holds ONLY the things nginx requires at http level -- an upstream and
# a rate-limit zone. It deliberately declares NO server block. The explorer is
# mounted at /plays/ on the EXISTING pbp.dustincremascoli.com vhost, so its
# routing lives in pbp-plays.inc, which pbp.conf includes inside its 443 server.
#
# WHY A SEPARATE conf.d FILE AT ALL, rather than putting these two directives in
# pbp.conf next to pbp_app's: because `upstream` and `limit_req_zone` are not
# legal inside a `server` block, so they cannot go in the .inc that carries the
# rest of this app's nginx config. Splitting them out is what lets the Dash app
# own every line of its own routing while touching pbp.conf exactly once.
#
# A conf.d file with no server block does not affect which vhost is the default
# server -- that is still decided among the files that DO declare one. See
# NGINX-RUNBOOK.md §1 in the ec2-nginx repo for why that matters here.

upstream pbp_web {
    # Gunicorn, bound to the loopback ONLY. Deliberately a different port from
    # the Streamlit agent's 8504: the two apps share a hostname and a TLS cert
    # and nothing else, and they are separate systemd units under separate
    # service users.
    server 127.0.0.1:8061 fail_timeout=0;
}

# 20r/s, the same rate the Streamlit half uses, and for a related but not
# identical reason.
#
# Streamlit needs it because it ships 60-100 JS chunks on first load. Dash is
# also an SPA and does the same on first load -- but unlike Streamlit it keeps
# using ordinary HTTP after that, because a Dash callback is a POST to
# /plays/_dash-update-component rather than a message on a WebSocket. So every
# filter change, every sort, and every block the infinite grid pulls IS a request
# this zone counts.
#
# That is why `burst` downstream is large. Dragging the season slider fires a
# callback per step, and scrolling a 200k-row grid pulls a 120-row block at a
# time; a real person exploring generates bursts that would look abusive to a
# limiter tuned for page loads. Nothing here costs LLM tokens -- the money risk
# that shapes the Streamlit half's limits does not exist on this app, which talks
# only to a local read-only DuckDB file -- so the limiter is protecting CPU on a
# 2-vCPU box, and that is all it needs to be sized for.
limit_req_zone $binary_remote_addr zone=pbp_web_all:10m rate=20r/s;
